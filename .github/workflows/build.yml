name: Build Forge 1.21.11 Plugin Tester

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build Forge mod
        run: gradle clean build --no-daemon
      - name: Upload Forge mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PluginTester-Forge-Minecraft-1.21.11-Paper-1.21.4
          path: build/libs/plugin-tester-1.1.0.jar
          if-no-files-found: error
